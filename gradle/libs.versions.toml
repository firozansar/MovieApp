# Mockito-Kotlin (Recommended for Kotlin projects for better syntax)
mockitoKotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }

# Mockito Android - For instrumented tests (androidTestImplementation)
