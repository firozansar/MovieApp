alias(libs.plugins.android.application)
alias(libs.plugins.jetbrains.kotlin.android)
alias(libs.plugins.google.dagger.hilt.android)
alias(libs.plugins.androidx.navigation.safeargs)
// For kotlin-kapt and kotlin-parcelize, they are typically applied differently
// using the kotlin("kapt") and kotlin("plugin.parcelize") syntax
// or ensuring the Kotlin Gradle plugin itself handles them.
// We will keep them as they are if they don't have direct entries in libs.plugins
apply plugin: 'kotlin-kapt'
apply plugin: "org.jetbrains.kotlin.plugin.parcelize"


def localProperties = new Properties()
def localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newInputStream())
}

android {
    compileSdkVersion 35

    defaultConfig {
        applicationId "info.firozansari.movieapp"
        targetSdkVersion 35
        minSdkVersion 26

        versionCode 2
        versionName "1.1"
        buildConfigField("String","TMDB_API_KEY", localProperties.getProperty("tmdb_api_key") ?: "\"\"")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
    kapt {
        correctErrorTypes true
    }
    dataBinding {
        enabled true
    }
    buildFeatures {
        viewBinding true
    }
//    sourceSets {
//        androidTest.java.srcDirs += "src/test-common/java"
//        test.java.srcDirs += "src/test-common/java"
//    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.google.android.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.swiperefreshlayout
    implementation libs.jetbrains.kotlin.reflect

    // Navigation Component
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // Room components
    implementation libs.androidx.room.runtime
    kapt libs.androidx.room.compiler
    implementation libs.androidx.room.ktx
    androidTestImplementation libs.androidx.room.testing

    // Lifecycle components
    implementation libs.androidx.lifecycle.extensions
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.viewmodel.ktx

    //Networking
    implementation libs.squareup.retrofit2.retrofit
    implementation libs.squareup.retrofit2.converter.gson
    implementation libs.jakewharton.retrofit2.kotlin.coroutines.adapter
    implementation libs.squareup.okhttp3.logging.interceptor
    implementation libs.google.code.gson
    implementation libs.squareup.retrofit2.converter.moshi
    api libs.squareup.moshi
    kapt libs.squareup.moshi.kotlin.codegen

    // Coroutines
    implementation libs.jetbrains.kotlinx.coroutines.core
    implementation libs.jetbrains.kotlinx.coroutines.android

    // hilt
    implementation libs.google.dagger.hilt.android
    kapt libs.google.dagger.hilt.compiler
    androidTestImplementation libs.google.dagger.hilt.android.testing
    kaptAndroidTest libs.google.dagger.hilt.compiler
    testImplementation libs.google.dagger.hilt.android.testing
    kaptTest libs.google.dagger.hilt.compiler

    // Moshi (already declared with networking, but as per original file structure)
    // api libs.squareup.moshi // Duplicate, already above
    // kapt libs.squareup.moshi.kotlin.codegen // Duplicate, already above

    // Coil for image loading
    implementation libs.coil.kt

    // Jetpack paging 3
    implementation libs.androidx.paging.runtime.ktx

    // JetPack DataStore
    implementation libs.androidx.datastore.preferences

    // Intuit ssp & sdp
    implementation libs.intuit.sdp
    implementation libs.intuit.ssp

    // Android Youtube Player
    implementation libs.pierfrancescosoffritti.androidyoutubeplayer.core

    // Chrome Custom Tab
    implementation libs.androidx.browser

    // Material Dot viewpager indicator library
    implementation libs.github.zhpanvip.viewpagerindicator

    // Pallet
    implementation libs.androidx.palette.ktx

    // debugging
    implementation libs.jakewharton.timber
    implementation libs.facebook.stetho
    implementation libs.facebook.stetho.okhttp3

    testImplementation libs.junit
    testImplementation libs.google.truth
    testImplementation libs.androidx.test.core
    testImplementation libs.mockito.core // General mockito

    testImplementation libs.robolectric // Uses robolectric version

    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.google.truth // Already defined for testImplementation
}

apply from: '../spotless.gradle'
